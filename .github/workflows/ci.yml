name: CI

# Runs on Dolusoft self-hosted LAN runners (org runner group "backend").
# The repo is private; pull_request only fires for branches inside the repo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: [self-hosted, dolusoft-lan]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Runner instances share one user/home; an isolated dest avoids the
      # ERR_PNPM_LINKING_FAILED race seen on the frontendx runners.
      # Version comes from package.json "packageManager".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Unit tests
        timeout-minutes: 5
        run: pnpm run test
