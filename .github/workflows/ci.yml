name: CI

# Public repo on the dedicated, sandboxed `dolusoft-fork` runner (org runner
# group `public-forks`, restricted to this file on main). Never add
# pull_request / pull_request_target: fork PR code must not reach our runner.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: [self-hosted, dolusoft-fork]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Version comes from package.json "packageManager".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Unit tests
        timeout-minutes: 5
        run: pnpm run test
